[package]
name = "blogen"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["SF-Zhou <sfzhou.scut@gmail.com>"]
description = "A fast, themeable static blog generator with math, syntax highlighting and Mermaid support"
documentation = "https://docs.rs/blogen"
readme = "README.md"
repository = "https://github.com/SF-Zhou/blogen"
license = "MIT OR Apache-2.0"
keywords = ["static-site", "blog", "markdown", "generator", "markdown-it"]
categories = ["command-line-utilities", "web-programming"]
exclude = ["/scripts/", "/packaging/"]

# Prebuilt binary support for `cargo binstall` / `cargo-binstall`. The release
# workflow publishes one archive per target with the executable at its root.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/blogen-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# On Linux always use the static musl build: it has no glibc version
# requirement and runs on every distribution (the archive also exists for gnu
# targets, but musl is the portable choice).
[package.metadata.binstall.overrides.'cfg(target_os = "linux")']
pkg-url = "{ repo }/releases/download/v{ version }/blogen-{ version }-{ target-arch }-unknown-linux-musl.tar.gz"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7"
infer = "0.22"
md-5 = "0.11"
merman = { version = "0.10", default-features = false, features = ["svg", "all-diagrams"] }
minijinja = { version = "3.1", features = ["json", "serde"] }
notify = "8.2"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
quick-js = { version = "0.4", features = ["patched"] }
rayon = "1.12"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
