# blogen parity fixture site.
#
# The expected outputs in ../expected/ were generated by the ORIGINAL generator
# blog generator (SF-Zhou/blog) from exactly this posts tree, see
# tests/fixtures/README.md. Keep this file and the posts byte-identical when
# regenerating the oracle.

[site]
name = "Fixture Blog"
# The old Node profile template hard-codes https://sf-zhou.github.io, so the
# fixture uses that URL to keep the oracle byte-comparable with blogen's
# config-driven output.
url = "https://sf-zhou.github.io"
description = "blogen parity fixture site"
language = "en"
default_author = "fixture-author"
web_master = "fixture-master"
google_analytics_id = "G-FIXTURE"

[build]
posts = "posts"
output = "public"
article_format = "md"
images = "images"
download_remote_images = false
clean = true
parallel = 1

[theme]
name = "default"
assets = "dist"

[profile]
path = "profile"
limit = 5

[comments.giscus]
repo = "SF-Zhou/sf-zhou.github.io"
repo_id = "MDEwOlJlcG9zaXRvcnk4MDc5ODgwNg=="
category = "Announcements"
category_id = "DIC_kwDOBNDkVs4CA6GQ"
mapping = "title"
reactions_enabled = "0"
emit_metadata = "0"
input_position = "bottom"
theme = "preferred_color_scheme"
lang = "en"

[rss]
enabled = true
file = "rss.xml"
limit = 20
